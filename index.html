<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マンダラチャート・プランナー | 目標達成・目標設定ツール</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f9fafb;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #4b5563;
            --border-color: #d1d5db;
            --center-bg: #e0e7ff;
            --center-border: #6366f1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding-bottom: 60px;
        }

        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--primary-color);
            text-decoration: none;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            margin-left: 1.5rem;
            font-size: 0.9rem;
            cursor: pointer;
        }

        nav a:hover {
            color: var(--primary-color);
        }

        .container {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .hero {
            text-align: center;
            margin-bottom: 2rem;
        }

        .hero h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        .hero p {
            color: var(--text-muted);
        }

        /* マンダラチャートのグリッドシステム */
        .mandala-wrapper {
            overflow-x: auto;
            padding: 1rem 0;
            display: flex;
            justify-content: center;
        }

        .mandala-outer-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 810px;
            min-width: 810px;
        }

        .mandala-inner-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            background-color: var(--border-color);
            border-radius: 8px;
            padding: 4px;
        }

        /* 中心（大目標）のブロックを目立たせる */
        .mandala-outer-grid > .mandala-inner-grid:nth-child(5) {
            background-color: var(--center-border);
        }

        .mandala-cell {
            background-color: var(--card-bg);
            border-radius: 4px;
            height: 85px;
            padding: 4px;
            display: flex;
            flex-direction: column;
        }

        .mandala-cell textarea {
            width: 100%;
            height: 100%;
            border: none;
            resize: none;
            font-size: 0.8rem;
            text-align: center;
            color: var(--text-main);
            background: transparent;
        }

        .mandala-cell textarea:focus {
            outline: none;
        }

        /* 各グリッドの中心セル */
        .mandala-inner-grid > .mandala-cell:nth-child(5) {
            background-color: #f3f4f6;
            font-weight: bold;
        }

        /* 真ん中のグリッドのセルたち */
        .mandala-outer-grid > .mandala-inner-grid:nth-child(5) > .mandala-cell {
            background-color: #eef2ff;
        }
        .mandala-outer-grid > .mandala-inner-grid:nth-child(5) > .mandala-cell:nth-child(5) {
            background-color: var(--center-bg);
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }
